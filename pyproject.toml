[project]
name = "murdoku-checker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ortools>=9.15.6755",
    "pydantic>=2,<3",
]

[project.scripts]
murdoku-checker = "murdoku_checker.mains.main_verify_puzzle:main"
murdoku-creator = "murdoku_checker.mains.main_generate_solution:main"
murdoku-generate = "murdoku_checker.mains.main_generate_new_puzzle:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
